<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Jogo da Velha</h1>

    <!-- Mostra de quem é a vez / quem ganhou -->
    <p id="status">Vez do X</p>

    <!-- Tabuleiro: 9 botões, um pra cada casa -->
    <div id="board">
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
    </div>

    <button id="reset">Reiniciar</button>
  </main>

  <!-- O script vem por último pra HTML já estar carregado quando ele rodar -->
  <script src="script.js"></script>
</body>
</html>
